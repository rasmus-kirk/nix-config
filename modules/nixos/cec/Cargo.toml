[package]
name = "cec-tv-liveness"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
env_logger = { version = "0.11", default-features = false }
evdev = { version = "0.13", features = ["tokio"] }
log = "0.4"
nix = { version = "0.29", default-features = false, features = ["fs", "ioctl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }

[profile.release]
panic = "abort"
